<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R&Y</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
/>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
/>
</head>
<body>
    <header class="header">

  <div class="header-top">

   <button class="menu-btn" aria-label="Abrir menu">
  <i class="fa-solid fa-bars"></i>
</button>
    

    <div class="logo">R&Y</div>

    <div class="social">
  <a href="#" aria-label="Carrinho">
    <i class="fa-solid fa-cart-shopping"></i>
  </a>
</div>

  </div>

 <div class="header-search">
  <i class="fa-solid fa-magnifying-glass"></i>
  <input type="text" placeholder="Buscar produtos">
</div>

</header>
<!-- fundo escuro -->
<div class="overlay"></div>

<nav class="menu">
  <button class="close-btn">✕</button>

  <ul>
    <li><a href="#">Início</a></li>
    <li><a href="#">Novidades</a></li>
    <li><a href="#">Vestidos</a></li>
    <li><a href="#">Shorts</a></li>
    <li><a href="#">Contato</a></li>
  </ul>
</nav>
<script>
  const btn = document.querySelector('.menu-btn');
  const menu = document.querySelector('.menu');
  const overlay = document.querySelector('.overlay');
  const closeBtn = document.querySelector('.close-btn');

  function closeMenu() {
    menu.classList.remove('active');
    overlay.classList.remove('active');
  }

  btn.addEventListener('click', () => {
    menu.classList.add('active');
    overlay.classList.add('active');
  });

  closeBtn.addEventListener('click', closeMenu);
  overlay.addEventListener('click', closeMenu);
</script>
 

    <div class="top-banner">
  <div class="banner-track">
    <span>Frete grátis acima de R$199</span>
    <span>Nova coleção disponível</span>
    <span>Elegância no dia a dia</span>
    <span>Frete grátis acima de R$199</span>
    <span>Nova coleção disponível</span>
  </div>
</div>
   <section class="slider">
  <div class="slides">
    <div class="slide active">
      <img src="img1.jpg" alt="Slide 1">
    </div>

    <div class="slide">
      <img src="img2.jpg" alt="Slide 2">
    </div>

    <div class="slide">
      <img src="img3.jpg" alt="Slide 3">
    </div>
  </div>

  <div class="dots">
    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
</section>
<script>
let index = 0;
const slides = document.querySelectorAll('.slide');
const dots = document.querySelectorAll('.dot');

function showSlide(i) {
  slides.forEach(slide => slide.classList.remove('active'));
  dots.forEach(dot => dot.classList.remove('active'));

  slides[i].classList.add('active');
  dots[i].classList.add('active');
}

setInterval(() => {
  index = (index + 1) % slides.length;
  showSlide(index);
}, 4000);
</script>
</body>
</html>
