<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel R7Y</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 400px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    .preview {
      margin-top: 15px;
      text-align: center;
    }

    .preview img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }

    .preview p {
      margin: 5px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Painel R7Y</h2>

  <form id="formProduto">
    <input type="text" id="nome" placeholder="Nome da peça" required>
    <input type="number" id="preco" placeholder="Preço" required>
    <input type="file" id="imagem" accept="image/*" required>
    <button type="submit">Salvar Produto</button>
  </form>

  <div class="preview" id="preview">
    <p>Pré-visualização</p>
  </div>
</div>

<script>
const CLOUD_NAME = "damrknw4o";
const UPLOAD_PRESET = "ousi_vivence";

const form = document.getElementById('formProduto');

form.addEventListener('submit', async function(e){
  e.preventDefault();

  const nome = document.getElementById('nome').value;
  const preco = document.getElementById('preco').value;
  const file = document.getElementById('imagem').files[0];

  if (!file) {
    alert("Escolha uma imagem!");
    return;
  }

  // upload da imagem
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);

  try {
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (!data.secure_url) {
      alert("Erro no upload");
      console.log(data);
      return;
    }

    const produto = {
      nome: nome,
      preco: preco,
      imagem: data.secure_url
    };

    let produtos = JSON.parse(localStorage.getItem('produtos')) || [];
    produtos.push(produto);

    localStorage.setItem('produtos', JSON.stringify(produtos));

    alert("Produto salvo com sucesso!");

    form.reset();

  } catch (error) {
    console.error(error);
    alert("Erro ao enviar imagem");
  }
});
</script>
</body>
</html>
